name: snyk

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false }}
    runs-on: ubuntu-latest
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Setup Snyk CLI
        if: ${{ env.SNYK_TOKEN != '' }}
        uses: snyk/actions/setup@v1.0.0

      - name: Add Flux Credentials Loaded From ENV
        run: composer config http-basic.composer.fluxui.dev "${{ secrets.FLUX_USERNAME }}" "${{ secrets.FLUX_LICENSE_KEY }}"

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Install Node dependencies
        run: npm ci

      - name: Run Snyk Open Source scan (Composer)
        if: ${{ env.SNYK_TOKEN != '' }}
        run: snyk test --file=composer.lock --package-manager=composer --severity-threshold=high

      - name: Run Snyk Open Source scan (npm)
        if: ${{ env.SNYK_TOKEN != '' }}
        run: snyk test --file=package.json --package-manager=npm --severity-threshold=high

      - name: Run Snyk Code scan
        if: ${{ env.SNYK_TOKEN != '' }}
        run: snyk code test --severity-threshold=high

      - name: Skip when Snyk token is unavailable
        if: ${{ env.SNYK_TOKEN == '' }}
        run: echo "SNYK_TOKEN is not configured for this workflow run."
